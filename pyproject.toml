[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderun-stats"
version = "1.0.0"
description = "Генерация SVG-карточки со статистикой CodeRun"
readme = "README.md"
authors = [
    {name = "Misha Zvyagin"}
]
license = {text = "MIT"}
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[project.scripts]
coderun-stats = "src.main:main"

[tool.ruff]
target-version = "py38"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]
select = [
    "E", "W", "F", "I", "C", "B", "UP", "SIM"
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.isort]
known-first-party = ["src"]